name: Tests

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente a ejecutar'
        type: choice
        options: [staging, production]
        default: staging

env:
  ENV: ${{ inputs.environment || 'staging' }}

jobs:
  api-tests:
    name: Parte 1 - API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'Parte 1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'Parte 1/package-lock.json'

      - name: Instalar dependencias
        run: npm ci
      - name: Validar tipos
        run: npm run typecheck

      - name: Ejecutar tests
        run: npx playwright test

      - name: Generar reporte Allure
        if: ${{ !cancelled() }}
        run: npm run report:generate

      - name: Publicar reporte Allure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-api-${{ env.ENV }}
          path: 'Parte 1/allure-report'
          retention-days: 14

      - name: Publicar reporte Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api-${{ env.ENV }}
          path: 'Parte 1/playwright-report'
          retention-days: 14

    ui-tests:
    name: Parte 2 - UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Imagen oficial de Playwright: trae los browsers y sus dependencias preinstalados.
    # Su versión debe coincidir con la de @playwright/test del proyecto.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    # Sin "defaults.working-directory": dentro de un container, una ruta con espacios
    # ("Parte 2") rompe el comando de Docker. Cada paso entra a la carpeta con cd.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'Parte 2/package-lock.json'

      - name: Instalar dependencias
        run: cd "Parte 2" && npm ci

      - name: Ejecutar tests
        run: cd "Parte 2" && npx playwright test

      - name: Generar reporte Allure
        if: ${{ !cancelled() }}
        run: cd "Parte 2" && npm run report:generate

      - name: Publicar reporte Allure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-ui-${{ env.ENV }}
          path: 'Parte 2/allure-report'
          retention-days: 14

      - name: Publicar reporte Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ui-${{ env.ENV }}
          path: 'Parte 2/playwright-report'
          retention-days: 14

  publish-reports:
    name: Publicar reportes en GitHub Pages
    needs: [api-tests, ui-tests]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Descargar reporte API
        uses: actions/download-artifact@v8
        with:
          name: allure-report-api-${{ env.ENV }}
          path: site/api

      - name: Descargar reporte UI
        uses: actions/download-artifact@v8
        with:
          name: allure-report-ui-${{ env.ENV }}
          path: site/ui

      - name: Crear página índice
        run: |
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="es">
          <head><meta charset="utf-8"><title>Reportes - Abstracta QA Challenge</title></head>
          <body style="font-family: sans-serif; max-width: 600px; margin: 40px auto;">
            <h1>Reportes de pruebas</h1>
            <p>Ambiente: <strong>${{ env.ENV }}</strong> · Generado: $(date -u '+%Y-%m-%d %H:%M UTC')</p>
            <ul>
              <li><a href="api/">Parte 1 - API (Allure)</a></li>
              <li><a href="ui/">Parte 2 - UI (Allure)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5