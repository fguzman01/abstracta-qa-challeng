# Alternativa al job de UI de tests.yml: instala browsers y dependencias en el runner
# en vez de usar la imagen oficial de Playwright. Solo se ejecuta de forma manual.
# Depende de los mirrors de Ubuntu, que a veces responden lento.
name: Tests UI (Ubuntu, sin contenedor)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente a ejecutar'
        type: choice
        options: [staging, production]
        default: staging

env:
  ENV: ${{ inputs.environment || 'staging' }}

jobs:
  ui-tests:
    name: Parte 2 - UI (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 'Parte 2'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'Parte 2/package-lock.json'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar browsers
        run: npx playwright install --with-deps
        timeout-minutes: 10

      - name: Ejecutar tests
        run: npx playwright test

      - name: Generar reporte Allure
        if: ${{ !cancelled() }}
        run: npm run report:generate

      - name: Publicar reporte Allure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-ui-ubuntu-${{ env.ENV }}
          path: 'Parte 2/allure-report'
          retention-days: 14

      - name: Publicar reporte Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ui-ubuntu-${{ env.ENV }}
          path: 'Parte 2/playwright-report'
          retention-days: 14